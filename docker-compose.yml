version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: librarix-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - librarix-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: librarix-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/librarix
    depends_on:
      - mongo
    networks:
      - librarix-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: librarix-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - librarix-net

volumes:
  mongo_data:

networks:
  librarix-net:
    driver: bridge
